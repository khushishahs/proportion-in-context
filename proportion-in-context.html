<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Experiment</title>
        <script src="https://unpkg.com/jspsych@7.3.4"></script>
        <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
        <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>

        <style>
            :root {
                --canvas-width: 1250px;
                --canvas-height: 760px;
                --instr-text-width: 900px;
                --mc-width: 180px;
                --side-character-size: 100px;
                --tiger-screen-width: 220px;
                --instr-stim-size: 600px;
                --instr-button-gap: 110px;
                --probability-face-size: 200px;
                --instr-video-width: 300px;
                --instr-video-height: 500px;
                --instr-mc-top: 200px;
                --instr-mc-right: 160px;
                --prob-mc-top: 132px;
                --prob-mc-right: 100px;
                --instr-text-top: 114px;
                --prob-instr-text-top: 38px;
                --instr-stim-top: 90px;
            }
/* fit the experiment canvas inside the browser viewport. */
html, body {
    margin: 0;
    overflow: hidden;
}

        #jspsych-content {
            display: flow-root;
            position: relative;
            width: var(--canvas-width);
            max-width: var(--canvas-width);
            min-height: var(--canvas-height);
            margin: 0 auto;
        }
/* imgs on test trials should retain the same dimensions used in CHS. */
#jspsych-content.trial-button-position {
    --canvas-width: clamp(810px, calc(100vw - 16px), 1100px);
    min-height: 0;
}
.tiger-screen {
    display: block;
    width: var(--tiger-screen-width);
    height: auto;
    margin: 0 auto 30px;
}
.trial-layout {
    position: relative;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: 156px auto;
    justify-items: center;
    gap: 10px 20px;
    padding-top: 8px;
    text-align: center;
}
.main-character {
    grid-column: 1 / -1;
    width: var(--side-character-size);
    height: 156px;
    object-fit: contain;
}
.stim-container {
    position: relative;
}
.stim-rect,
.side-character-img {
    display: block;
    width: auto;
    height: auto;
    margin: 0 auto;
}
.stim-rect {
    width: 375px;
    height: 575px;
}
.side-character-container {
    position: relative;
    display: grid;
    place-items: center;
    width: 170px;
    height: 165px;
    margin: 0 auto;
}
.side-character-img {
    pointer-events: none;
}
#jspsych-content.trial-button-position #jspsych-html-button-response-btngroup {
    position: absolute;
    inset: 0;
    pointer-events: none;
}
.trial-button-position .jspsych-html-button-response-button {
    position: absolute;
    margin: 0 !important;
}
.side-character-btn {
    width: 100%;
    height: 100%;
    opacity: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
}
.stim-container.pulse-highlight {
    animation: yellowPulse 0.85s ease-in-out 1;
}
@keyframes yellowPulse {
    0% {
        box-shadow: 0 0 0 rgba(255, 230, 0, 0);
    }
50% {
    box-shadow: 0 0 35px 12px rgba(255, 230, 0, 0.9);
}
100% {
    box-shadow: 0 0 0 rgba(255, 230, 0, 0);
}
}
/* instruction trials */
.instr-layout {
    position: relative;
    width: var(--canvas-width);
    height: var(--canvas-height);
    margin: 0 auto;
    text-align: center;
}
.instr-main-character {
    position: absolute;
    top: var(--instr-mc-top);
    right: var(--instr-mc-right);
    width: var(--mc-width);
    height: auto;
}
.instr-text {
    position: absolute;
    top: var(--instr-text-top);
    left: 50%;
    transform: translate(-50%, -50%);
    width: var(--instr-text-width);
    text-align: center;
}
.instr-video {
    width: var(--instr-video-width);
    height: var(--instr-video-height);
}
.instr-stim-container {
    position: absolute;
    top: var(--instr-stim-top);
    left: 50%;
    width: var(--instr-stim-size);
    height: var(--instr-stim-size);
    transform: translateX(-50%);
}
.instr-stim-img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
}
.instr-side-character {
    display: block;
    width: var(--side-character-size);
    height: var(--side-character-size);
    margin: 12px auto 0 auto;
    pointer-events: none;
}
.subset-button-position #jspsych-html-button-response-btngroup {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: var(--instr-button-gap);
    margin-top: -60px;
}
.subset-circle-button {
    width: 175px;
    height: 175px;
    border: 3px solid black;
    border-radius: 50%;
    cursor: pointer;
}
.subset-button-position
.jspsych-html-button-response-button:nth-child(1)
.subset-circle-button {
    background-color: orange;
}
.subset-button-position
.jspsych-html-button-response-button:nth-child(2)
.subset-circle-button {
    background-color: dodgerblue;
}
.subset-circle-button:hover {
    transform: scale(1.05);
}
/* probability instruction trials */
.prob-instr-text {
    position: absolute;
    top: var(--prob-instr-text-top);
    left: 50%;
    transform: translateX(-50%);
    width: var(--instr-text-width);
    text-align: center;
}
.prob-instr-main-character {
    position: absolute;
    top: var(--prob-mc-top);
    right: var(--prob-mc-right);
    width: var(--mc-width);
    height: auto;
}
.prob-instr-side-character {
    display: block;
    width: var(--side-character-size);
    height: var(--side-character-size);
    margin: 7px auto 0 auto;
    pointer-events: none;
}
.prob-instr-helper {
    margin-top: 8px;
    font-size: 20px;
    line-height: 1.4;
}
.yes-no-button-position #jspsych-html-button-response-btngroup {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: var(--instr-button-gap);
    margin-top: -80px;
}
.probability-face-button {
    position: relative;
    z-index: 11;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
}
.probability-face-img {
    width: var(--probability-face-size);
    height: var(--probability-face-size);
    object-fit: contain;
    pointer-events: none;
}
.yes-no-button-position
.jspsych-html-button-response-button:nth-child(1)
.probability-face-img {
    content: url("img/probability_instructions/happy_face.png");
}
.yes-no-button-position
.jspsych-html-button-response-button:nth-child(2)
.probability-face-img {
    content: url("img/probability_instructions/sad_face.png");
}
.probability-face-button:hover {
    transform: scale(1.05);
}
/* party transitions */
.party-transition-layout {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: black;
    z-index: 9999;
}
.party-transition-video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: black;
}
/* locking audios */
.audio-locked #jspsych-instructions-next,
.audio-locked #jspsych-html-button-response-btngroup button {
    pointer-events: none;
    opacity: 0.5;
}
.audio-locked #jspsych-html-button-response-btngroup,
.audio-locked #jspsych-html-button-response-btngroup .jspsych-html-button-response-button,
.audio-locked #jspsych-html-button-response-btngroup button {
    pointer-events: none !important;
}
    .child-next-btn {
        min-width: 180px;
        min-height: 65px;
        font-size: 26px;
        font-weight: bold;
    }
    #jspsych-content:has(.party-transition-layout) #jspsych-html-button-response-btngroup {
        position: fixed;
        right: 35px;
        bottom: 30px;
        z-index: 10000;
    }
    .party-introduction-arrow {
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
    }
    .party-introduction-arrow svg {
        display: block;
        width: min(160px, 25vw, 25vh);
        height: auto;
        filter: drop-shadow(0 2px 5px black);
        pointer-events: none;
    }
    </style>
</head>

// shuffle is the Fisher-Yates (aka Knuth) Shuffle
function shuffle(array) {
let currentIndex = array.length,
    randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
return array;
}

// disable participant's response while audio/video is still playing
function lockAudio() {
    audioLockCount++;
    setAudioLock(true);
}
// re-enable participant's response after audio/video finishes
function unlockAudio() {
    audioLockCount = Math.max(0, audioLockCount - 1);
    if (audioLockCount === 0) {
        setAudioLock(false);
    }
}
document.addEventListener(
    "keydown",
function (event) {

);
// audio/video playback instructions 
function createAudioPrompt(audioPath, nextAudioPath, playVideoAfter) {
    return `
    <div
    class="audio-prompt-wrapper"
    data-audio-path="${audioPath}"
    data-next-audio-path="${nextAudioPath || ""}"
    data-play-video-after="${playVideoAfter ? "true" : "false"}"
    style="text-align: center; margin-top: 20px;"
    ></div>
    `;
}
// play audio and manage controls for instruction trials
function playAudioFile(audioPath, onEnded) {
var audio = new Audio(audioPath);
var hasEnded = false;
function finishAudio() {
        if (hasEnded) {
            return;
        }
    hasEnded = true;
    if (onEnded) {
        onEnded();
    }
}
audio.preload = "auto";
audio.playsInline = true;
audio.onended = finishAudio;
audio.onerror = finishAudio;
var playPromise = audio.play();
if (playPromise && typeof playPromise.catch === "function") {
    playPromise.catch(function () {
        finishAudio();
    });
}
return audio;
}
// play instruction audio while keeping the page locked so participants can't interact with the experiment until it finishes
function playInstructionAudioFile(audioPath, onEnded) {
    lockAudio();
    playAudioFile(audioPath, function () {
        unlockAudio();
        if (onEnded) {
            onEnded();
        }
});
}
// play click instructions after the probability demo video ends
function finishProbabilityDemoAudio() {
    playInstructionAudioFile(getClickInstructionsAudio(), function () {
        setAudioLock(false);
    });
}
// find the current instruction page audio wrapper and start the correct audio sequence
function playCurrentInstructionAudio() {
var wrapper = document.querySelector(".audio-prompt-wrapper");
    if (!wrapper) {
        return;
    }
var audioPath = wrapper.getAttribute("data-audio-path");
var nextAudioPath = wrapper.getAttribute("data-next-audio-path");
var playVideoAfter = wrapper.getAttribute("data-play-video-after") === "true";
var audioKey = audioPath + "|" + nextAudioPath + "|" + playVideoAfter;
if (!audioPath || audioKey === lastInstructionAudio) {
    return;
}
lastInstructionAudio = audioKey;
playInstructionAudioFile(audioPath, function () {
    if (nextAudioPath) {
        playInstructionAudioFile(nextAudioPath, function () {
            if (playVideoAfter) {
                document.getElementById("probability-demo-video").play();
            }
    });
} else if (playVideoAfter) {
    setAudioLock(true);
var video = document.getElementById("probability-demo-video");
    if (video) {
        video.play();
    }
}
});
}

    ${createAudioPrompt("audios/sharing/task_introduction.m4a")}
    <img src="img/tiger.png" style="position: absolute; right: 40px; top: 100px; width: 180px;">
    <div style="margin-top: 150px;">
        <img src="img/sharing_instructions/total.png" style="display: block; margin: 0 auto 20px auto;">

</div>
`,
`
<div style="text-align: center; margin-top: 30px; position: relative; width: 1000px; margin-left: auto; margin-right: auto;">
    ${createAudioPrompt("audios/sharing/demo.m4a")}
    <img src="img/tiger.png" style="position: absolute; right: 40px; top: 100px; width: 180px;">
    <div style="margin-top: 150px;">
        <img src="${img_by_format}" style="display: block; margin: 0 auto 20px auto;">

`,
`
<div style="text-align: center; margin-top: 200px;">

}
// format 2 instruction page
function format2_instructions() {
var instruction_img = getInstructionImg(1);
    return [
    `
    <div style="text-align: center; margin-top: 150px;">
        <img src="img/tiger.png" style="position: absolute; right: 90px; top: 250px; width: 180px;">
        ${createAudioPrompt(getBlock2TransitionAudio())}
        <img src="${instruction_img}" style="display: block; margin: 0 auto 20px auto;">
        <img src="img/elephant.png" style="width: 100px; display: block; margin: 0 auto;">
    </div>
`,
];
}
// transition between instructions and block 1
function get_block1_transition_stimulus() {
    return `
    <div style="text-align: center; margin-top: 225px;">
        <img src="img/tiger.png" class="tiger-screen">
        ${createAudioPrompt(getBlock1TransitionAudio())}
        </div>
`;
}
function getBlock1TransitionAudio() {
    if (myCondition == "probability") {
        return "audios/probability/block1_transition.m4a";
    } else if (myCondition == "mixture") {
        return "audios/mixture/block1_transition.m4a";
    } else if (myCondition == "sharing") {
        return "audios/sharing/block1_transition.m4a";
    }
return "";
}
// task-specific transition audios for block 2
function getBlock2TransitionAudio() {
    if (myCondition == "probability") {
        return "audios/probability/block2_transition.m4a";
    } else if (myCondition == "mixture") {
        return "audios/mixture/block2_transition.m4a";
    } else if (myCondition == "sharing") {
        return "audios/sharing/block2_transition.m4a";
    }
return "";
}
function makeInstructionPages(getPages, onStart, shouldAutoAdvance) {
    var pages = getPages();

    return {
        on_timeline_start: onStart,
        timeline: pages.map(function (page, pageIndex) {
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: page,
                choices: ["Next"],
                button_html: '<button class="child-next-btn" disabled>%choice%</button>',
                on_load: function () {
                    if (!shouldAutoAdvance || !shouldAutoAdvance(pageIndex, pages.length)) {
                        loadNextButton();
                        return;
                    }

                    document.querySelector(".child-next-btn").hidden = true;
                    var audioPath = document.querySelector(".audio-prompt-wrapper").dataset.audioPath;
                    playInstructionAudioFile(audioPath, function () {
                        jsPsych.finishTrial();
                    });
                },
            };
        }),
    };
}

var instructions = makeInstructionPages(task_introduction, function () {
    block = 0;
    trialIndex = 0;
}, function (pageIndex, pageCount) {
    return pageIndex === pageCount - 1 || (myCondition === "sharing" && pageIndex === 0);
});

var block1_transition = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function () {
        return get_block1_transition_stimulus();
    },
choices: ["Next"],
button_html: '<button class="child-next-btn" disabled>%choice%</button>',
on_load: loadNextButton,
};
var block2_instructions = makeInstructionPages(format2_instructions, function () {
    block = 1;
    trialIndex = 0;
    ratio_loop = 1;
    curCondition = ratio_tasks[1].condition;
});
var block1_procedure = {
    timeline: [stim_display, party_transitions, white_screen],
    timeline_variables: stim_block_1,
    on_timeline_start: function () {
        ratio_loop = 0;
        block = 0;
        trialIndex = 0;
        trialIndexType = "test";
        curCondition = ratio_tasks[0].condition;
    },
};
var white_screen_before_ending = {
    timeline: [white_screen],
    conditional_function: function () {
        return partyTransitionIndex < party_transition_videos.length;
    },
};

var block2_procedure = {
    timeline: [stim_display, party_transitions, white_screen_before_ending],
    timeline_variables: stim_block_2,
    on_timeline_start: function () {
        ratio_loop = 1;
        block = 1;
        trialIndex = 0;
        trialIndexType = "test";
        curCondition = ratio_tasks[1].condition;
    },
};
var ratio_loop = 0;

var startAudio;
var click_to_start = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
        <div style="text-align: center; margin-top: 250px;">
            <img src="img/tiger.png" alt="Tiger" class="tiger-screen">
        </div>
    `,
    choices: ["Start"],
    on_load: function () {
        startAudio = playAudioFile("audios/start.m4a");
    },
    on_finish: function () {
        if (startAudio) {
            startAudio.pause();
        }
    },
    data: { event: "introduction_party_start" },
};

var party_introduction_trial = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
        <div class="party-transition-layout">
            <img src="img/party_introduction.png" alt="Tiger's party" class="party-transition-video">
        </div>
    `,
    choices: ["Next"],
    button_html: partyArrow,
    on_load: function () {
        lockAudio();
        playAudioFile("audios/introduction_party.m4a", revealPartyArrow);
    },
    data: { event: "party_introduction_audio" },
};

var ratio_timeline = [click_to_start, party_introduction_trial, instructions];
if (myCondition == "mixture") {
    ratio_timeline.push(mixture_check_orange_block1);
    ratio_timeline.push(mixture_feedback_orange);
    ratio_timeline.push(mixture_check_blue_block1);
    ratio_timeline.push(mixture_feedback_blue);
}
if (myCondition == "probability") {
    ratio_timeline.push(probability_check_orange_block1);
    ratio_timeline.push(probability_feedback_orange);
    ratio_timeline.push(probability_check_blue_block1);
    ratio_timeline.push(probability_feedback_blue);
}
if (myCondition == "sharing") {
    ratio_timeline.push(sharing_check_orange_block1);
    ratio_timeline.push(sharing_feedback_orange);
    ratio_timeline.push(sharing_check_blue_block1);
    ratio_timeline.push(sharing_feedback_blue);
}
ratio_timeline.push(
block1_transition,
block1_procedure,
block2_instructions,
block2_procedure,
);
var ratio_node = {
    timeline: ratio_timeline,
    conditional_function: function () {
        return ratio_tasks.length > 0;
    },
};
timeline.push(ratio_node);
function alignTestButtons(content) {
    var buttons = content.querySelectorAll(".jspsych-html-button-response-button");
    content.querySelectorAll(".side-character-container").forEach(function (animal, index) {
        var button = buttons[index];
        button.style.left = animal.offsetLeft + animal.offsetParent.offsetLeft + "px";
        button.style.top = animal.offsetTop + animal.offsetParent.offsetTop + "px";
        button.style.width = animal.offsetWidth + "px";
        button.style.height = animal.offsetHeight + "px";
    });
}

function fitExperimentToViewport() {
    var content = document.getElementById("jspsych-content");
    if (!content) {
        return;
    }

    var scale = 1;
    if (!content.querySelector(".party-transition-layout")) {
        var viewport = document.documentElement;
        var testLayout = content.querySelector(".trial-layout");
        var tigerScreen = content.querySelector(".tiger-screen");
        // test grid maintains space for the tallest animal on every trial.
        var width = testLayout ? testLayout.offsetWidth : tigerScreen ? 1250 : Math.max(content.offsetWidth, content.scrollWidth);
        var height = testLayout ? testLayout.offsetHeight : tigerScreen ? 760 : Math.max(content.offsetHeight, content.scrollHeight);
        scale = Math.min(1, (viewport.clientWidth - 16) / width, (viewport.clientHeight - 16) / height);
    }
    content.style.zoom = scale;
    if (content.classList.contains("trial-button-position")) {
        alignTestButtons(content);
    }
}

function watchExperimentLayout() {
    var frame;
    function scheduleFit() {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(fitExperimentToViewport);
    }
    new MutationObserver(scheduleFit).observe(document.body, { childList: true, subtree: true });
    document.addEventListener("load", scheduleFit, true);
    window.addEventListener("resize", scheduleFit);
}

watchExperimentLayout();
jsPsych.run(timeline);
</script>
